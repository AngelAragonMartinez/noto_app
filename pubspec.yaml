name: notes_app
description: "Noto — local encrypted notes for Linux and Windows (Flutter)."
publish_to: "none"
version: 1.1.5+7

environment:
  sdk: ">=3.12.0 <4.0.0"

# Constraints are pinned to a major range rather than `any`. Unpinned
# constraints are what let a Flutter SDK bump silently pull in incompatible
# transitive versions, which is how the Windows build broke.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cryptography: ^2.9.0
  file_selector: ^1.1.0
  flutter_quill: ^11.5.1
  flutter_riverpod: ^3.4.2
  flutter_secure_storage: ^11.0.0
  font_awesome_flutter: ^11.0.0
  go_router: ^18.0.0
  intl: ^0.20.2   # flutter_localizations pins this from the SDK
  local_auth: ^3.0.2
  path: ^1.9.1
  path_provider: ^2.1.6
  pdf: ^3.13.0
  sqflite_sqlcipher: ^3.4.1
  uuid: ^4.6.0
  vsc_quill_delta_to_html: ^1.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png
    - assets/icon_dark.png
