name: Release

# Publishes installable builds. Push a tag to cut a release:
#   git tag v1.0.0 && git push origin v1.0.0
# Or run manually from the Actions tab to get the artifacts without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.44.0"

jobs:
  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Patch pub cache
        run: dart run tool/patch_pub_cache.dart

      - run: flutter build windows --release

      - name: Resolve version
        id: version
        shell: bash
        run: |
          # A tag wins; otherwise fall back to pubspec so manual runs still work.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build installer
        shell: pwsh
        run: |
          # Inno Setup ships with the runner image, so nothing is downloaded.
          $iscc = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "Inno Setup not found at $iscc" }
          & $iscc "/DAppVersion=${{ steps.version.outputs.version }}" installer\noto.iss
          if ($LASTEXITCODE -ne 0) { throw 'ISCC failed' }

      - name: Package portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path build\windows\x64\runner\Release\* `
            -DestinationPath "dist\Noto-${{ steps.version.outputs.version }}-windows-x64-portable.zip"

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          } | Set-Content -Encoding utf8 dist\SHA256SUMS-windows.txt
          Get-Content dist\SHA256SUMS-windows.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noto-windows-release
          path: dist/
          if-no-files-found: error

  linux:
    name: Linux tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev libsecret-1-dev libjsoncpp-dev

      - run: flutter pub get

      - name: Patch pub cache
        run: dart run tool/patch_pub_cache.dart

      - run: flutter build linux --release

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            version="$(grep -m1 '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')"
          fi
          mkdir -p dist
          tar -czf "dist/Noto-$version-linux-x64.tar.gz" \
            -C build/linux/x64/release/bundle .
          ( cd dist && sha256sum ./*.tar.gz > SHA256SUMS-linux.txt )
          cat dist/SHA256SUMS-linux.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: noto-linux-release
          path: dist/
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [windows, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      # Only this job can write, and only to create the release.
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        env:
          # gh is preinstalled on the runner, so no extra action is trusted here.
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la dist
          gh release create "${GITHUB_REF#refs/tags/}" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Noto ${GITHUB_REF#refs/tags/v}" \
            --generate-notes \
            dist/*
